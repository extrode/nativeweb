name: CI

on:
  push:
    branches-ignore: [main, dev]
  pull_request:

env:
  # No JauntyQ sibling checkout exists in CI -- package mode pulls the pinned
  # JauntyQ.Generator/JauntyQ.Runtime versions from Directory.Packages.props
  # instead (see Directory.Build.props's dual-mode resolution).
  DOTNET_BUILD_ARGS: -p:JauntyQUsePackages=true
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    # Unit/integration/e2e are plain JIT test hosts, not AOT publishes, so
    # they don't need the Windows-only MSVC toolchain -- Postgres service
    # containers are also Linux-runner-only in GitHub Actions.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          # nativeweb_app completes the neutral-naming rename (spec 002 R11):
          # no migration references the role by name, so CI just provisions
          # the neutral name and local dev carries a nativeweb_app role that
          # owns nativeweb_dev (created 2026-07-31; epass_app itself was left
          # untouched because it also owns other projects' local
          # databases).
          POSTGRES_USER: nativeweb_app
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: nativeweb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__NativeWeb: "Host=localhost;Database=nativeweb_test;Username=nativeweb_app;Password=ci_test_password"
      ConnectionStrings__DevMarks: "Host=localhost;Database=devmarks_test;Username=devmarks_app;Password=ci_test_password"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Apply migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "Applying $f"
            PGPASSWORD=ci_test_password psql -h localhost -U nativeweb_app -d nativeweb_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Provision DevMarks database
        # DevMarks has its own database and role, mirroring local dev
        # (db/devmarks/README.md). The service container's POSTGRES_USER is a
        # superuser, so it can create both and run the citext migration.
        run: |
          PGPASSWORD=ci_test_password psql -h localhost -U nativeweb_app -d nativeweb_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE devmarks_app LOGIN PASSWORD 'ci_test_password';" \
            -c "CREATE DATABASE devmarks_test OWNER devmarks_app;"

      - name: Apply DevMarks migrations
        # 0001 (citext) needs a superuser; everything else runs as devmarks_app
        # so the created tables are owned by the role the app connects as --
        # same split db/devmarks/migrate.sh makes locally.
        run: |
          for f in db/devmarks/migrations/*.sql; do
            echo "Applying $f"
            role=devmarks_app
            [ "$(basename "$f")" = "0001_extensions.sql" ] && role=nativeweb_app
            PGPASSWORD=ci_test_password psql -h localhost -U "$role" -d devmarks_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Restore
        run: dotnet restore $DOTNET_BUILD_ARGS

      - name: Build
        run: dotnet build --no-restore $DOTNET_BUILD_ARGS

      # Spec 003 R31: fail the build when any resolved package (direct or
      # transitive) has a known CVE. `dotnet list` takes no -p: properties, but
      # MSBuild reads properties from the environment, so JauntyQUsePackages as
      # an env var makes project evaluation here match the package-mode restore
      # above (without it, evaluation falls back to checkout mode and a JauntyQ
      # sibling dir that does not exist on the runner). The command exits 0
      # either way, so the gate is two greps: fail on any "> PackageName"
      # finding line, and fail if the positive "no vulnerable packages"
      # confirmation never appears -- an audit that evaluated nothing (broken
      # sources, format change) must not pass silently.
      - name: Vulnerable package gate
        env:
          JauntyQUsePackages: "true"
        run: |
          out=$(dotnet list package --vulnerable --include-transitive)
          echo "$out"
          if echo "$out" | grep -Eq '^\s*>'; then
            echo '::error::Vulnerable package(s) found -- see the list above.'
            exit 1
          fi
          if ! echo "$out" | grep -q 'has no vulnerable packages'; then
            echo '::error::Vulnerability audit produced no per-project confirmation -- treating as failed.'
            exit 1
          fi

      - name: Install Playwright browsers
        run: pwsh tests/nativeweb.web.tests.e2e/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Unit tests
        run: dotnet test tests/nativeweb.web.tests.unit --no-build $DOTNET_BUILD_ARGS

      - name: Integration tests
        run: dotnet test tests/nativeweb.web.tests.integration --no-build $DOTNET_BUILD_ARGS

      - name: E2E tests
        run: dotnet test tests/nativeweb.web.tests.e2e --no-build $DOTNET_BUILD_ARGS

      - name: DevMarks unit tests
        run: dotnet test tests/nativeweb.devmarks.tests.unit --no-build $DOTNET_BUILD_ARGS

      - name: DevMarks integration tests
        run: dotnet test tests/nativeweb.devmarks.tests.integration --no-build $DOTNET_BUILD_ARGS

      - name: DevMarks E2E tests
        # DevMarksProcessFixture publishes apps/devmarks itself (Release, no
        # --no-build shortcut applies to that inner publish).
        run: dotnet test tests/nativeweb.devmarks.tests.e2e --no-build $DOTNET_BUILD_ARGS

  aot-publish:
    # The NativeAOT gate: MSVC's cl.exe/link.exe (via vcvars) are only
    # available in the Windows Developer environment that windows-latest
    # runners ship preinstalled (VS2022 Build Tools) -- this job proves
    # apps/web still links and stays warning-free under TreatWarningsAsErrors
    # for AOT/trim analysis, matching the local publish gate used throughout
    # Phase 0. It doesn't need Postgres: publish only compiles, it never runs
    # the app.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Publish (NativeAOT)
        run: dotnet publish apps/web/nativeweb.web.csproj -c Release -p:JauntyQUsePackages=true

      - name: Publish DevMarks (NativeAOT)
        run: dotnet publish apps/devmarks/nativeweb.devmarks.csproj -c Release -p:JauntyQUsePackages=true
