name: CI

on:
  push:
    branches-ignore: [main, dev]
  pull_request:

env:
  # No JauntyQ sibling checkout exists in CI -- package mode pulls the pinned
  # JauntyQ.Generator/JauntyQ.Runtime versions from Directory.Packages.props
  # instead (see Directory.Build.props's dual-mode resolution).
  DOTNET_BUILD_ARGS: -p:JauntyQUsePackages=true
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    # Unit/integration/e2e are plain JIT test hosts, not AOT publishes, so
    # they don't need the Windows-only MSVC toolchain -- Postgres service
    # containers are also Linux-runner-only in GitHub Actions.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          # epass_app survives the neutral-naming rename on purpose: it is the
          # role the vendored db/ migrations grant against, and db/ is
          # feature-frozen from epass.io. Renaming it needs its own migration
          # plus a local reprovision, so it is tracked separately.
          POSTGRES_USER: epass_app
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: nativeweb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__NativeWeb: "Host=localhost;Database=nativeweb_test;Username=epass_app;Password=ci_test_password"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Apply migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "Applying $f"
            PGPASSWORD=ci_test_password psql -h localhost -U epass_app -d nativeweb_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Restore
        run: dotnet restore $DOTNET_BUILD_ARGS

      - name: Build
        run: dotnet build --no-restore $DOTNET_BUILD_ARGS

      - name: Install Playwright browsers
        run: pwsh tests/nativeweb.web.tests.e2e/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Unit tests
        run: dotnet test tests/nativeweb.web.tests.unit --no-build $DOTNET_BUILD_ARGS

      - name: Integration tests
        run: dotnet test tests/nativeweb.web.tests.integration --no-build $DOTNET_BUILD_ARGS

      - name: E2E tests
        run: dotnet test tests/nativeweb.web.tests.e2e --no-build $DOTNET_BUILD_ARGS

  aot-publish:
    # The NativeAOT gate: MSVC's cl.exe/link.exe (via vcvars) are only
    # available in the Windows Developer environment that windows-latest
    # runners ship preinstalled (VS2022 Build Tools) -- this job proves
    # apps/web still links and stays warning-free under TreatWarningsAsErrors
    # for AOT/trim analysis, matching the local publish gate used throughout
    # Phase 0. It doesn't need Postgres: publish only compiles, it never runs
    # the app.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Publish (NativeAOT)
        run: dotnet publish apps/web/nativeweb.web.csproj -c Release -p:JauntyQUsePackages=true
