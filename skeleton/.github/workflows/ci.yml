name: CI

on:
  push:
    branches-ignore: [main, dev]
  pull_request:

env:
  # ---------------------------------------------------------------------------
  # KNOWN GAP: this workflow cannot pass yet, and that is deliberate.
  #
  # Package mode is the only resolution CI can use -- a GitHub runner has no
  # sibling NativeWeb or jauntyq checkout for the `$(NativeWebRoot)` /
  # `$(JauntyQRoot)` probes in Directory.Build.props. But the private
  # NativeWeb.* / JauntyQ.* feed DOES NOT EXIST YET: nothing has been pushed
  # anywhere the runner can reach, so `dotnet restore` below fails and every
  # later step (including the CVE gate) never runs.
  #
  # The working path today is checkout mode: build locally with sibling
  # NativeWeb + jauntyq checkouts, or pass -p:NativeWebRoot=... -p:JauntyQRoot=...
  # explicitly.
  #
  # The workflow is wired ahead of the feed on purpose (spec 003 R1/R6): when a
  # private feed is provisioned, add its source and this file needs no edit.
  # Until then, treat a red CI run that dies at Restore as the known gap, not a
  # regression -- and do not "fix" it by deleting these flags, which would make
  # the build silently look for checkouts that are not there.
  # ---------------------------------------------------------------------------
  DOTNET_BUILD_ARGS: -p:NativeWebUsePackages=true -p:JauntyQUsePackages=true
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    # Unit/integration/e2e are plain JIT test hosts, not AOT publishes, so
    # they don't need the Windows-only MSVC toolchain -- Postgres service
    # containers are also Linux-runner-only in GitHub Actions.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          # The container's POSTGRES_USER is a superuser; the product's own
          # database and app role are provisioned from it below, mirroring
          # local dev (db/README.md).
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      __PRODUCT____Db__ConnectionString: "Host=localhost;Database=__product___test;Username=__product___app;Password=ci_test_password"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Provision __PRODUCT__ database
        run: |
          PGPASSWORD=ci_test_password psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE __product___app LOGIN PASSWORD 'ci_test_password';" \
            -c "CREATE DATABASE __product___test OWNER __product___app;"

      - name: Apply migrations
        # Through the shipped runner, not an inline loop, so CI exercises the
        # same migrate.sh (superuser-for-extensions split, schema_migrations
        # tracking) a deployment uses.
        env:
          PGHOST: localhost
          PGDATABASE: __product___test
          APP_ROLE: __product___app
          SUPERUSER_ROLE: postgres
          PGPASSWORD: ci_test_password
        run: bash db/migrate.sh

      - name: Restore
        run: dotnet restore $DOTNET_BUILD_ARGS

      - name: Build
        run: dotnet build --no-restore $DOTNET_BUILD_ARGS

      # Spec 003 R31: fail the build when any resolved package (direct or
      # transitive) has a known CVE. `dotnet list` takes no -p: properties, but
      # MSBuild reads properties from the environment, so the UsePackages vars
      # as env vars make project evaluation here match the package-mode restore
      # above (without them, evaluation falls back to checkout mode and sibling
      # dirs that do not exist on the runner). The command exits 0 either way,
      # so the gate is two greps: fail on any "> PackageName" finding line, and
      # fail if the positive "no vulnerable packages" confirmation never appears
      # -- an audit that evaluated nothing (broken sources, format change) must
      # not pass silently.
      - name: Vulnerable package gate
        env:
          NativeWebUsePackages: "true"
          JauntyQUsePackages: "true"
        run: |
          out=$(dotnet list package --vulnerable --include-transitive)
          echo "$out"
          if echo "$out" | grep -Eq '^\s*>'; then
            echo '::error::Vulnerable package(s) found -- see the list above.'
            exit 1
          fi
          if ! echo "$out" | grep -q 'has no vulnerable packages'; then
            echo '::error::Vulnerability audit produced no per-project confirmation -- treating as failed.'
            exit 1
          fi

      - name: Install Playwright browsers
        run: pwsh tests/__product__.tests.e2e/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Unit tests
        run: dotnet test tests/__product__.tests.unit --no-build $DOTNET_BUILD_ARGS

      - name: Integration tests
        run: dotnet test tests/__product__.tests.integration --no-build $DOTNET_BUILD_ARGS

      - name: Install NativeAOT link prerequisites
        # The e2e fixture's inner publish does a full NativeAOT link on this
        # Linux runner, which needs clang and zlib headers.
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: E2E tests
        # __PRODUCT__ProcessFixture publishes apps/__product__ itself (Release,
        # no --no-build shortcut applies to that inner publish). The UsePackages
        # env vars are what reach that CHILD process -- $DOTNET_BUILD_ARGS only
        # applies to the outer `dotnet test`, and MSBuild reads bare environment
        # variables as properties.
        env:
          NativeWebUsePackages: "true"
          JauntyQUsePackages: "true"
        run: dotnet test tests/__product__.tests.e2e --no-build $DOTNET_BUILD_ARGS

  aot-publish:
    # The NativeAOT gate: MSVC's cl.exe/link.exe (via vcvars) are only
    # available in the Windows Developer environment that windows-latest
    # runners ship preinstalled (VS2022 Build Tools) -- this job proves
    # apps/__product__ still links and stays warning-free under
    # TreatWarningsAsErrors for AOT/trim analysis. It doesn't need Postgres:
    # publish only compiles, it never runs the app.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Publish (NativeAOT)
        run: dotnet publish apps/__product__/__product__.csproj -c Release -p:NativeWebUsePackages=true -p:JauntyQUsePackages=true
