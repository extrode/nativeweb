name: CI

on:
  push:
    branches-ignore: [main, dev]
  pull_request:

env:
  # ---------------------------------------------------------------------------
  # Both frameworks resolve from PACKAGES, the pinned Extrode.NativeWeb.* and
  # Extrode.JauntyQ.* versions in Directory.Packages.props, from nuget.org with
  # no credential. That is the default in Directory.Build.props, so nothing here
  # selects it: CI builds the same thing a developer machine builds.
  #
  # Until 2026-11-04 this workflow cloned the framework from its `main` branch
  # and built in checkout mode, because no Extrode.NativeWeb.* version had been
  # published. That tested whatever the framework's release branch held that
  # day, not the version this product pins, so a framework push could turn this
  # product red with nothing changed here. Pinned packages cannot.
  #
  # THE PRODUCT IS CHECKED OUT INTO product/, NOT the workspace root. That layout
  # kept a framework clone beside the product rather than under it, where the
  # product's Directory.Packages.props reached the clone and restore died NU1008
  # (measured 2026-08-17). No clone remains, but a product that adds one back,
  # to build against an unreleased framework change, needs the same layout, and
  # `defaults.run.working-directory` below keeps every run: step in product/.
  #
  # To build against a framework checkout instead, check it out beside product/
  # and set NativeWebUsePackages: "false" and NativeWebRoot here, as bare
  # variables rather than -p: flags: MSBuild reads them as properties, so they
  # reach `dotnet list package` (which takes no -p:) and the NativeAOT publish
  # the e2e fixture spawns as a child process.
  # ---------------------------------------------------------------------------
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

# Every `run:` step operates on the product, which the checkout steps place in
# product/ rather than at the workspace root. Action steps are unaffected --
# actions/checkout takes its own `path:`. (Do not write the u-s-e-s key inside a
# comment in this file: ActionPinTests scans for it without skipping comments and
# reads a mention as an unpinned action.)
defaults:
  run:
    working-directory: product

jobs:
  test:
    # Unit/integration/e2e are plain JIT test hosts, not AOT publishes, so
    # they don't need the Windows-only MSVC toolchain -- Postgres service
    # containers are also Linux-runner-only in GitHub Actions.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          # The container's POSTGRES_USER is a superuser; the product's own
          # database and app role are provisioned from it below, mirroring
          # local dev (db/README.md).
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      __PRODUCT____Db__ConnectionString: "Host=localhost;Database=__product___test;Username=__product___app;Password=ci_test_password"
    steps:
      - uses: actions/checkout@v7
        with:
          path: product

      # No setup-dotnet step: the hosted images already ship the 10.0.x SDKs, so the
      # action installed nothing. global.json at the product root pins which band is
      # acceptable, and it travels with the stamped product rather than living only
      # in a workflow the generated repo's owner may never read.

      - name: Provision __PRODUCT__ database
        run: |
          PGPASSWORD=ci_test_password psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE __product___app LOGIN PASSWORD 'ci_test_password';" \
            -c "CREATE DATABASE __product___test OWNER __product___app;"

      - name: Apply migrations
        # Through the shipped runner, not an inline loop, so CI exercises the
        # same migrate.sh (superuser-for-extensions split, schema_migrations
        # tracking) a deployment uses.
        env:
          PGHOST: localhost
          PGDATABASE: __product___test
          APP_ROLE: __product___app
          SUPERUSER_ROLE: postgres
          PGPASSWORD: ci_test_password
        run: bash db/migrate.sh

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # Spec 003 R31: fail the build when any resolved package (direct or
      # transitive) has a known CVE. `dotnet list` takes no -p: properties, which
      # is why any mode switch belongs in a workflow-level environment variable
      # rather than a flag. It reports the SOLUTION's projects: the
      # Extrode.NativeWeb.* packages and what they depend on are listed, but
      # anything marked PrivateAssets="all" -- the JauntyQ generator's whole
      # dependency graph, for one -- contributes nothing here and has to be
      # audited where it is built.
      #
      # The command exits 0 either way, so the gate is two greps: fail on any
      # "> PackageName" finding line, and fail if the positive "no vulnerable
      # packages" confirmation never appears -- an audit that evaluated nothing
      # (broken sources, format change) must not pass silently.
      - name: Vulnerable package gate
        run: |
          out=$(dotnet list package --vulnerable --include-transitive)
          echo "$out"
          if echo "$out" | grep -Eq '^\s*>'; then
            echo '::error::Vulnerable package(s) found -- see the list above.'
            exit 1
          fi
          if ! echo "$out" | grep -q 'has no vulnerable packages'; then
            echo '::error::Vulnerability audit produced no per-project confirmation -- treating as failed.'
            exit 1
          fi

      - name: Install Playwright browsers
        run: pwsh tests/__product__.tests.e2e/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Unit tests
        run: dotnet test --project tests/__product__.tests.unit --no-build

      - name: Integration tests
        run: dotnet test --project tests/__product__.tests.integration --no-build

      - name: Install NativeAOT link prerequisites
        # The e2e fixture's inner publish does a full NativeAOT link on this
        # Linux runner, which needs clang and zlib headers.
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: E2E tests
        # __PRODUCT__ProcessFixture publishes apps/__product__ itself (Release,
        # no --no-build shortcut applies to that inner publish). That inner
        # publish is a CHILD process: it resolves the framework from the same
        # pinned packages by default, and it would see a workflow-level
        # environment variable but never a -p: flag on the outer command.
        run: dotnet test --project tests/__product__.tests.e2e --no-build

  aot-publish:
    # The NativeAOT gate: MSVC's cl.exe/link.exe (via vcvars) are only
    # available in the Windows Developer environment that windows-latest
    # runners ship preinstalled (VS2022 Build Tools) -- this job proves
    # apps/__product__ still links and stays warning-free under
    # TreatWarningsAsErrors for AOT/trim analysis. It doesn't need Postgres:
    # publish only compiles, it never runs the app.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: product

      # Same as the test job: preinstalled SDK, global.json pins the band.

      # No step sets up MSVC, and none is needed: the ILCompiler runs its own
      # bundled findvcvarsall.bat, which asks vswhere for the C++ tools and hands
      # the linker an absolute path. See this repo's own ci.yml for the detail --
      # a stamped product inherits whatever this file says, and what it used to
      # say was a third-party action that was redundant and broke the publish
      # path. If the tools are genuinely absent the publish fails with a named
      # error, never a silent fallback.
      - name: Publish (NativeAOT)
        run: dotnet publish apps/__product__/__product__.csproj -c Release
