name: CI

on:
  push:
    branches-ignore: [main, dev]
  pull_request:

env:
  # ---------------------------------------------------------------------------
  # This workflow builds in CHECKOUT mode, which is the same mode a developer
  # machine uses and the only one that resolves today.
  #
  # It used to force package mode (-p:NativeWebUsePackages=true
  # -p:JauntyQUsePackages=true) and could not pass: the private NativeWeb.* /
  # JauntyQ.* feed does not exist, so `dotnet restore` died and every later step
  # -- the CVE gate included -- never ran. Package mode is still available
  # (pass the two flags yourself) for the day those packages publish; it is just
  # no longer what CI depends on.
  #
  # A runner has no sibling checkout for the `$(NativeWebRoot)` / `$(JauntyQRoot)`
  # probes in Directory.Build.props, so the steps below clone both repositories
  # and these two variables point the probes at them.
  #
  # THE PRODUCT IS CHECKED OUT INTO product/, NOT the workspace root, so that the
  # framework clones are its SIBLINGS rather than its children. That is not
  # cosmetic. Nested under the product, `Directory.Packages.props` discovery walks
  # up out of the clone and finds the PRODUCT's copy, which sets
  # ManagePackageVersionsCentrally=true; jauntyq ships no Directory.Packages.props
  # of its own and its PackageReferences carry Version attributes, so central
  # package management switches on underneath it and restore dies. Measured
  # 2026-08-17 in exactly this layout: NU1008 on JauntyQ.Generator and
  # JauntyQ.Runtime, naming eleven and four packages. The sibling layout builds
  # clean. `defaults.run.working-directory` below is what keeps every run: step
  # pointed at the product.
  #
  # They are BARE variables, not -p: flags, on purpose: MSBuild
  # reads bare environment variables as properties, so one definition here reaches
  # `dotnet restore`, `dotnet build`, `dotnet test`, `dotnet list package` (which
  # accepts no -p: at all) and the NativeAOT publish the e2e fixture spawns as a
  # CHILD process. A -p: flag reaches only the command it is written on, which is
  # what made the old file need four separate copies of the same setting.
  #
  # Both are absolute, via github.workspace: MSBuild resolves a relative root
  # against each project's own directory, not the repo root.
  #
  # Strictly, only JauntyQRoot is load-bearing on a runner: the sibling layout
  # happens to be exactly what Directory.Build.props's NativeWebRoot fallback
  # probe (..\NativeWeb, one level up from the product) already resolves to, while
  # its JauntyQRoot probe points somewhere else entirely. NativeWebRoot is set
  # anyway, because resolution that works by coincidence of layout is the kind
  # that breaks silently when the layout is next edited.
  #
  # If either checkout is wrong or missing the build FAILS LOUDLY -- Ensure*Root
  # in Directory.Build.props probes for a sentinel csproj, so an empty or stale
  # directory is an error rather than a silently-skipped ProjectReference and a
  # pile of CS0246s. Verified 2026-08-17 against a product stamped from this
  # skeleton, in this workspace layout: correct roots build clean, a bogus
  # NativeWebRoot produces 10 "NativeWeb checkout not found" errors.
  # ---------------------------------------------------------------------------
  NativeWebRoot: ${{ github.workspace }}/NativeWeb
  JauntyQRoot: ${{ github.workspace }}/jauntyq
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

# Every `run:` step operates on the product, which the checkout steps place in
# product/ rather than at the workspace root. Action steps are unaffected --
# actions/checkout takes its own `path:`. (Do not write the u-s-e-s key inside a
# comment in this file: ActionPinTests scans for it without skipping comments and
# reads a mention as an unpinned action.)
defaults:
  run:
    working-directory: product

jobs:
  test:
    # Unit/integration/e2e are plain JIT test hosts, not AOT publishes, so
    # they don't need the Windows-only MSVC toolchain -- Postgres service
    # containers are also Linux-runner-only in GitHub Actions.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          # The container's POSTGRES_USER is a superuser; the product's own
          # database and app role are provisioned from it below, mirroring
          # local dev (db/README.md).
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      __PRODUCT____Db__ConnectionString: "Host=localhost;Database=__product___test;Username=__product___app;Password=ci_test_password"
    steps:
      - uses: actions/checkout@v7
        with:
          path: product

      # The framework, as a checkout rather than as packages -- this is what makes
      # the NativeWebRoot / JauntyQRoot variables at the top of this file resolve.
      #
      # Both repositories are private, so actions/checkout's default GITHUB_TOKEN,
      # which is scoped to THIS repository alone, cannot read them:
      # FRAMEWORK_CHECKOUT_TOKEN must be a repository secret holding a token with
      # read access to both. Without it the step fails with "Repository not found",
      # and that is the right failure -- there is no arrangement here where a green
      # run silently skipped the framework.
      #
      # `ref` is a moving branch because neither framework repository publishes
      # tags yet (NativeWeb has no `main` at all as of 2026-08-17). Pin both to a
      # tag as soon as they do: on a branch, a push to the framework can turn this
      # product's CI red with nothing having changed here.
      #
      # LICENCE: JauntyQ is used from a local checkout under terms permitting
      # self-hosted-SaaS use of its generated output only. Cloning it here is fine
      # for a product this organisation hosts itself; do not enable this workflow
      # in a repository outside those terms, and never ship the resulting binary
      # to a third party.
      - name: Check out the framework (NativeWeb)
        uses: actions/checkout@v7
        with:
          repository: extrode-legacy-org/NativeWeb
          ref: dev
          path: NativeWeb
          token: ${{ secrets.FRAMEWORK_CHECKOUT_TOKEN }}
          persist-credentials: false

      - name: Check out the framework (JauntyQ)
        uses: actions/checkout@v7
        with:
          repository: extrode-legacy-org/jauntyq
          ref: dev
          path: jauntyq
          token: ${{ secrets.FRAMEWORK_CHECKOUT_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Provision __PRODUCT__ database
        run: |
          PGPASSWORD=ci_test_password psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE __product___app LOGIN PASSWORD 'ci_test_password';" \
            -c "CREATE DATABASE __product___test OWNER __product___app;"

      - name: Apply migrations
        # Through the shipped runner, not an inline loop, so CI exercises the
        # same migrate.sh (superuser-for-extensions split, schema_migrations
        # tracking) a deployment uses.
        env:
          PGHOST: localhost
          PGDATABASE: __product___test
          APP_ROLE: __product___app
          SUPERUSER_ROLE: postgres
          PGPASSWORD: ci_test_password
        run: bash db/migrate.sh

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # Spec 003 R31: fail the build when any resolved package (direct or
      # transitive) has a known CVE. `dotnet list` takes no -p: properties -- the
      # reason NativeWebRoot / JauntyQRoot are workflow-level environment
      # variables, which MSBuild reads as properties, so evaluation here resolves
      # the same way the restore above did. It reports the SOLUTION's projects, so
      # framework packages appear only where they flow through an ordinary
      # ProjectReference; anything the framework marks PrivateAssets="all" -- the
      # JauntyQ generator's whole dependency graph, for one -- contributes nothing
      # here and has to be audited where it is built.
      #
      # The command exits 0 either way, so the gate is two greps: fail on any
      # "> PackageName" finding line, and fail if the positive "no vulnerable
      # packages" confirmation never appears -- an audit that evaluated nothing
      # (broken sources, format change) must not pass silently.
      - name: Vulnerable package gate
        run: |
          out=$(dotnet list package --vulnerable --include-transitive)
          echo "$out"
          if echo "$out" | grep -Eq '^\s*>'; then
            echo '::error::Vulnerable package(s) found -- see the list above.'
            exit 1
          fi
          if ! echo "$out" | grep -q 'has no vulnerable packages'; then
            echo '::error::Vulnerability audit produced no per-project confirmation -- treating as failed.'
            exit 1
          fi

      - name: Install Playwright browsers
        run: pwsh tests/__product__.tests.e2e/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Unit tests
        run: dotnet test tests/__product__.tests.unit --no-build

      - name: Integration tests
        run: dotnet test tests/__product__.tests.integration --no-build

      - name: Install NativeAOT link prerequisites
        # The e2e fixture's inner publish does a full NativeAOT link on this
        # Linux runner, which needs clang and zlib headers.
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: E2E tests
        # __PRODUCT__ProcessFixture publishes apps/__product__ itself (Release,
        # no --no-build shortcut applies to that inner publish). That inner
        # publish is a CHILD process, so it inherits the workflow-level
        # NativeWebRoot / JauntyQRoot environment variables and resolves the
        # framework the same way -- which is precisely why those are environment
        # variables rather than -p: flags on the outer command.
        run: dotnet test tests/__product__.tests.e2e --no-build

  aot-publish:
    # The NativeAOT gate: MSVC's cl.exe/link.exe (via vcvars) are only
    # available in the Windows Developer environment that windows-latest
    # runners ship preinstalled (VS2022 Build Tools) -- this job proves
    # apps/__product__ still links and stays warning-free under
    # TreatWarningsAsErrors for AOT/trim analysis. It doesn't need Postgres:
    # publish only compiles, it never runs the app.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: product

      # Same framework checkout as the test job, and for the same reason -- this
      # job resolves NativeWebRoot / JauntyQRoot from the workflow-level variables
      # too. See the long note on those steps above for the token, the ref pinning
      # and the JauntyQ licence constraint.
      - name: Check out the framework (NativeWeb)
        uses: actions/checkout@v7
        with:
          repository: extrode-legacy-org/NativeWeb
          ref: dev
          path: NativeWeb
          token: ${{ secrets.FRAMEWORK_CHECKOUT_TOKEN }}
          persist-credentials: false

      - name: Check out the framework (JauntyQ)
        uses: actions/checkout@v7
        with:
          repository: extrode-legacy-org/jauntyq
          ref: dev
          path: jauntyq
          token: ${{ secrets.FRAMEWORK_CHECKOUT_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Pinned to a SHA, not the mutable v1 tag. This is a third-party action whose
      # step runs with the workflow's token on every push, so a moved tag would swap
      # the code executed here with no change landing in the repo -- and a stamped
      # product inherits whatever this file says. SHA is v1 as of 2026-08-17
      # (resolved with `gh api repos/ilammy/msvc-dev-cmd/git/ref/tags/v1`); bump
      # deliberately, and read the diff.
      #
      # Still node20, and not by choice: the action's last release is v1.13.0
      # (2024-01-01) and its action.yml at HEAD is still `using: node20`, so no
      # node24 version exists to bump to. Every other action here is node24.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Publish (NativeAOT)
        run: dotnet publish apps/__product__/__product__.csproj -c Release
